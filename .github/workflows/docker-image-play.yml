name: Create and publish ben-play Docker image

# Builds the play-API-only image (Dockerfile.play) and publishes it to
# ghcr.io/<owner>/ben-play. Triggered on the same v* tags as the main image.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ben-play

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1
      # Build locally first and smoke-test the container before anything is
      # pushed: Dockerfile.play copies src/*.py by name, so a new module that
      # gameapi.py imports is otherwise only noticed when a server starts it.
      - name: Build Docker image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.play
          load: true
          tags: ben-play:smoke
      - name: Smoke test /bid and /lead
        run: |
          docker run -d --name smoke -p 8085:8085 ben-play:smoke
          ok=
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then
              echo "Container exited during startup"; break
            fi
            out=$(curl -sS --max-time 60 'http://localhost:8085/bid?user=smoketest&dealer=N&seat=N&vul=&ctx=&hand=AK52.KQ3.J84.T92&dummy=&played=&tournament=imp' || true)
            case "$out" in *'"bid"'*) echo "bid: $out"; ok=1; break;; esac
            sleep 10
          done
          if [ -n "$ok" ]; then
            out=$(curl -sS --max-time 120 'http://localhost:8085/lead?user=smoketest&dealer=N&seat=E&vul=&ctx=1N--3N----&hand=KQT52.Q3.J84.T92&tournament=imp' || true)
            echo "lead: $out"
            case "$out" in *'"card"'*) ;; *) ok=;; esac
          fi
          if [ -z "$ok" ]; then
            docker logs --tail 50 smoke
            exit 1
          fi
          docker rm -f smoke
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.play
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
